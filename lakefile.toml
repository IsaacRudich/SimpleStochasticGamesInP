name = "SSGinP"
version = "0.1.0"
defaultTargets = ["SSGinP", "OAI", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "SSGinP"

[[lean_lib]]
name = "OAI"
globs = ["OAI.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
